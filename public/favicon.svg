<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    ZJKVM brand mark: a keycap — KVM starts with the keyboard — with the
    family period as its legend. Gold gradient coloring (#f5c84c → #e09f0a),
    transparent background with round-cap strokes; works directly on both
    light and dark backgrounds. Same grammar as the ZJBlog mark.
  -->
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#e09f0a"/>
    </linearGradient>
  </defs>
  <rect x="17" y="17" width="66" height="66" rx="15" fill="none" stroke="url(#g)" stroke-width="9" />
  <circle cx="50" cy="50" r="8" fill="url(#g)" />
</svg>
