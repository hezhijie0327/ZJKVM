<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    ZJKVM brand mark: a keycap — KVM starts with the keyboard — stroked in
    the family gold gradient (#f5c84c → #e09f0a, round caps, stroke 14) with
    the family period at (85,85) closing the mark. Transparent ground, works
    directly on both light and dark backgrounds. Same grammar as the ZJBlog
    and ZJSearch marks.
  -->
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#e09f0a"/>
    </linearGradient>
  </defs>
  <rect x="14" y="14" width="48" height="48" rx="12" fill="none" stroke="url(#g)" stroke-width="14" />
  <circle cx="85" cy="85" r="7" fill="url(#g)" />
</svg>
