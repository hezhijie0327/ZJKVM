<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 116 116">
  <!--
    ZJKVM brand mark: the simplified NanoKVM-USB dongle face — ring button
    top-left, two status bars top-right, port dash bottom-left — in the
    family gold gradient (#f5c84c → #e09f0a, round caps, composite-tier
    stroke 10) with the family period at (85,85) closing the mark.
    Transparent ground, works directly on both light and dark backgrounds.
    Same grammar as the ZJBlog and ZJSearch marks.
  -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="92" y2="92">
      <stop offset="0" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#e09f0a"/>
    </linearGradient>
  </defs>
  <circle cx="27" cy="27" r="12" fill="none" stroke="url(#g)" stroke-width="10" />
  <path d="M52 20 H74" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" />
  <path d="M52 34 H74" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" />
  <path d="M20 52 V62" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" />
  <circle cx="85" cy="85" r="7" fill="url(#g)" />
</svg>
